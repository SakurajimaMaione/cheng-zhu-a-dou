function dragStart(ev,t){if(placing)return;ev.preventDefault();let ghost=document.createElement('div');ghost.className='dragGhost';ghost.textContent=t.kind;document.body.appendChild(ghost);drag={t,ghost,moved:false};moveGhost(ev);t.el.style.opacity='.35';t.el.setPointerCapture?.(ev.pointerId);t.el.onpointermove=moveDrag;t.el.onpointerup=t.el.onpointercancel=endDrag}

function endDrag(ev){if(!drag)return;let d=drag;moveGhost(ev);let el=document.elementFromPoint(ev.clientX,ev.clientY),targetEl=el?.closest?.('.tower'),cell=el?.closest?.('#myGrid .cell');d.ghost.remove();d.t.el.style.opacity='';document.querySelectorAll('.cell.drop').forEach(c=>c.classList.remove('drop'));drag=null;if(!cell||cell.classList.contains('roadcell'))return;let target=towers.find(x=>x.el===targetEl);if(target&&target!==d.t){if(target.kind===d.t.kind&&target.lv===d.t.lv){target.lv++;towers=towers.filter(x=>x!==d.t);d.t.el.remove();target.el.remove();towerEl(target);toast(`合成成功：${target.kind}升至${target.lv}阶`)}else toast('只有相同文字、相同阶级才能合成')}else if(!target){d.t.cell=Number(cell.dataset.i);d.t.el.remove();towerEl(d.t)}update()}
function selectTower(t){if(placing)return;if(!selected){selected=t;t.el.classList.add('selected');$('#status').textContent=`已选 ${t.kind}${t.lv}阶，再点相同同阶合成`}else if(selected===t){selected.el.classList.remove('selected');selected=null;$('#status').textContent='点击文字，再选择空格放置'}else if(selected.kind===t.kind&&selected.lv===t.lv){let keep=selected;keep.lv++;towers=towers.filter(x=>x!==t);t.el.remove();keep.el.remove();towerEl(keep);selected=null;$('#status').textContent=`合成成功：${keep.kind} 升至 ${keep.lv} 阶`;toast(`两个${keep.lv-1}阶${keep.kind} → ${keep.lv}阶${keep.kind}`)}else{selected.el.classList.remove('selected');selected=t;t.el.classList.add('selected');toast('必须选择两个相同且同阶的字')};update()}
function cellClick(i){if(!placing||roadCells.has(i))return;if(towers.some(t=>t.cell===i)){toast('这个格子已经有字了');return}let t={id:++uid,cell:i,kind:placing,lv:1,last:0};towers.push(t);towerEl(t);placing=null;document.querySelectorAll('.cell').forEach(c=>c.classList.remove('valid'));$('#status').textContent='已落字，点击两个相同同阶字可合成'}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{if(gold<2)return;gold-=2;placing=b.dataset.kind;selected?.el.classList.remove('selected');selected=null;document.querySelectorAll('#myGrid .cell:not(.roadcell)').forEach(c=>c.classList.add('valid'));$('#status').textContent=`选择空格放置「${placing}」`;update()});$('#recruit').onclick=()=>{if(gold<1)return;gold--;let k=kinds[Math.random()*4|0],free=[...Array(24).keys()].filter(i=>!roadCells.has(i)&&!towers.some(t=>t.cell===i));if(!free.length){gold++;toast('阵地已满');return}let t={id:++uid,cell:free[Math.random()*free.length|0],kind:k,lv:1,last:0};towers.push(t);towerEl(t);toast('招贤得「'+k+'」');update()};
const path=[[0,15],[18,15],[38,15],[62,15],[65,30],[65,48],[65,63],[48,63],[30,63],[23,72],[23,95]];function spawnEnemy(){let side=$('#mySide'),e=document.createElement('div'),hp=75+wave*18,u={id:++uid,p:0,hp,max:hp,speed:.055+wave*.002,el:e};e.className='foe';e.innerHTML=`兵<i style="width:100%"></i>`;side.appendChild(e);enemies.push(u);drawEnemy(u);if(Math.random()<.4)botBuild()}
function drawEnemy(u){let n=Math.min(path.length-1,Math.floor(u.p)),f=Math.min(1,u.p-n),a=path[n],b=path[Math.min(n+1,path.length-1)];u.x=a[0]+(b[0]-a[0])*f;u.y=a[1]+(b[1]-a[1])*f;u.el.style.left=u.x+'%';u.el.style.top=u.y+'%';u.el.querySelector('i').style.width=Math.max(0,u.hp/u.max*100)+'%'}function removeEnemy(u){u.el.remove();enemies=enemies.filter(x=>x!==u)}
function botBuild(){let grid=$('#enemyGrid'),free=[...Array(48).keys()].filter(i=>!roadCells.has(i)&&!grid.children[i].children.length);if(!free.length)return;let t={cell:free[Math.random()*free.length|0],kind:Math.random()<.15?heroes[Math.random()*4|0]:soldiers[Math.random()*4|0],lv:1};towerEl(t,true)}
function gameTick(){if(!playing)return;seconds--;gold=Math.min(30,gold+1.2);$('#clock').textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');if(seconds%25===0){wave++;$('#enemyWave').textContent=wave}enemies.forEach(u=>{u.p+=u.speed;if(u.p>=path.length-1){life--;removeEnemy(u);toast('敌军突破，阿斗受损！')}else drawEnemy(u)});towers.forEach(t=>{t.last--;if(t.last>0)return;let cell=$('#myGrid').children[t.cell],cx=(cell.offsetLeft+cell.offsetWidth/2)/$('#myGrid').offsetWidth*80+10,cy=(cell.offsetTop+cell.offsetHeight/2)/$('#myGrid').offsetHeight*88+6,target=enemies.find(u=>Math.hypot(u.x-cx,u.y-cy)<stats[t.kind][1]*31);if(target){target.hp-=stats[t.kind][0]*Math.pow(1.8,t.lv-1);t.last=Math.max(1,5-t.lv);if(target.hp<=0){removeEnemy(target);gold+=1;enemyLife=Math.max(0,enemyLife-(Math.random()<.18?1:0));toast('击破敌军，向对手施压')}}});update();if(life<=0||enemyLife<=0||seconds<=0)end(enemyLife<=0||(seconds<=0&&life>enemyLife))}
function start(){playing=true;towers.forEach(t=>t.el?.remove());enemies.forEach(removeEnemy);towers=[];enemies=[];gold=8;life=enemyLife=10;seconds=180;wave=1;placing=selected=null;$('#intro').classList.add('hide');$('#over').classList.add('hide');clearInterval(tickTimer);clearInterval(spawnTimer);tickTimer=setInterval(gameTick,500);spawnTimer=setInterval(spawnEnemy,1500);for(let i=0;i<3;i++)botBuild();update()}function end(win){playing=false;clearInterval(tickTimer);clearInterval(spawnTimer);$('#result').textContent=win?'长坂常胜':'胜败兵家事';$('#score').textContent=life+' — '+enemyLife;$('#over').classList.remove('hide')}$('#start').onclick=()=>{event.target.textContent='匹配中…';setTimeout(start,900)};$('#again').onclick=start;$('#reset').onclick=start;$('#help').onclick=()=>toast('先选下方文字再点空格；点两个相同同阶文字即可合成');update();
</script></body></html>
